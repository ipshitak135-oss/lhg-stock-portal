<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LHG Storage Admin</title>

<link rel="stylesheet" href="admin.css">

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>

<body>
 <input type="file" id="excelFile" accept=".xlsx,.xls" style="display:none;">

<div class="dashboard">

<h1>LHG Storage Admin</h1>

<p>Manage Storage Inventory</p>

<div class="action-bar">

<button id="addItemBtn">➕ Add Item</button>

<button id="uploadExcelBtn">📤 Upload Excel</button>

<button id="exportExcelBtn">📥 Export Excel</button>

<button id="logout">🚪 Logout</button>

</div>

<div class="add-form">

<input
type="text"
id="itemName"
placeholder="Item Name"
>

<input
type="text"
id="cupboardNo"
placeholder="Cupboard No"
>

<input
type="text"
id="shelfNo"
placeholder="Shelf No"
>

<button id="saveItem">

💾 Save Item

</button>

</div>

<h2>Inventory List</h2>

<div class="search-section">

<input
type="text"
id="adminSearch"
placeholder="Search Item..."
>

<button id="searchItem">

🔍 Search

</button>

</div>

<table id="adminTable">

<thead>

<tr>

<th>Item Name</th>

<th>Cupboard</th>

<th>Shelf</th>

<th>Action</th>

</tr>

</thead>

<tbody id="adminTableBody">

</tbody>

</table>



</div>

<script>

if(sessionStorage.getItem("lhgAdmin")!=="true"){

window.location.href="admin.html";

}

const API_URL="https://script.google.com/macros/s/AKfycbxU4eAP4vpmtl7bkO_7t-LcUexB4j-lWL_owh_Q3nGASolq76BsMPW1Tfts8-ASK7EB/exec";

const saveBtn=document.getElementById("saveItem");
const searchBtn=document.getElementById("searchItem");
const uploadBtn=document.getElementById("uploadExcelBtn");
const exportBtn=document.getElementById("exportExcelBtn");

const item=document.getElementById("itemName");
const cupboard=document.getElementById("cupboardNo");
const shelf=document.getElementById("shelfNo");

const table=document.getElementById("adminTableBody");

let inventory=[];

async function loadInventory(){

try{

const res=await fetch(API_URL);

inventory=await res.json();

renderTable(inventory);

}catch(err){

console.error(err);

alert("Inventory Load Failed");

}

}
function renderTable(data){

table.innerHTML="";

data.forEach((row,index)=>{

table.innerHTML+=`

<tr>

<td>${row[0]}</td>

<td>${row[1]}</td>

<td>${row[2]}</td>

<td>

<button class="editBtn" onclick="editItem(${index})">

✏ Edit

</button>

<button class="deleteBtn" onclick="deleteItem(${index})">

🗑 Delete

</button>

</td>

</tr>

`;

});

}

saveBtn.onclick=async function(){

if(item.value.trim()==""||cupboard.value.trim()==""||shelf.value.trim()==""){

alert("Please fill all fields.");

return;

}

if (editRow !== -1) {

    const response = await fetch(API_URL, {

        method: "POST",

        body: JSON.stringify({
            action: "edit",
            row: editRow + 2,
            item: item.value.trim(),
            cupboard: cupboard.value.trim(),
            shelf: shelf.value.trim()
        })

    });

    const result = await response.json();

    if (result.status === "success") {

        alert("✅ Item Updated Successfully");

        editRow = -1;

        saveBtn.textContent = "💾 Save Item";

        item.value = "";
        cupboard.value = "";
        shelf.value = "";

        await loadInventory();

    }

    return;

}
const body={

action:"add",

item:item.value.trim(),

cupboard:cupboard.value.trim(),

shelf:shelf.value.trim()

};

try{

const response=await fetch(API_URL,{

method:"POST",

body:JSON.stringify(body)

});

const result=await response.json();

if(result.status==="success"){

alert("✅ Item Added Successfully");

item.value="";

cupboard.value="";

shelf.value="";

await loadInventory();

}else{

alert("Failed to save item.");

}

}catch(err){

console.error(err);

alert(err.message);

}

};

searchBtn.onclick=function(){

const key=document.getElementById("adminSearch").value.trim().toLowerCase();

const filtered=inventory.filter(row=>

(row[0]||"").toLowerCase().includes(key)

);

renderTable(filtered);

};

let editRow = -1;

function editItem(i) {

    editRow = i;

    item.value = inventory[i][0];
    cupboard.value = inventory[i][1];
    shelf.value = inventory[i][2];

    saveBtn.textContent = "💾 Update Item";

}
function deleteItem(i){

alert("Delete Function Next Step");

}

uploadBtn.onclick = function () {
    document.getElementById("excelFile").click();
};

document.getElementById("excelFile").addEventListener("change", function (e) {

    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = async function (evt) {

        const data = new Uint8Array(evt.target.result);

        const workbook = XLSX.read(data, { type: "array" });

        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

        const response = await fetch(API_URL, {

            method: "POST",

            body: JSON.stringify({
                action: "upload",
                rows: rows
            })

        });

        const result = await response.json();

        if (result.status === "success") {

            alert("✅ Excel Uploaded Successfully");

            loadInventory();

        } else {

            alert("Upload Failed");

        }

    };

    reader.readAsArrayBuffer(file);

});
exportBtn.onclick=function(){

alert("Export Function Next Step");

};

document.getElementById("logout").onclick=function(){

sessionStorage.removeItem("lhgAdmin");

window.location.href="index.html";

};

loadInventory();

</script>

</body>

</html>
